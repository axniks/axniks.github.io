<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ratio | Employment risk help on WhatsApp</title>
  <meta name="description" content="Start with Ratio on WhatsApp for immediate employment risk triage.">
  <style>
    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --text: #1a1210;
      --muted: #6b4f3a;
      --primary: #d63278;
      --border: rgba(0, 0, 0, 0.1);
      --max-width: 840px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      line-height: 1.65;
      background:
        radial-gradient(circle at top left, rgba(255, 47, 134, 0.08), transparent 28%),
        linear-gradient(180deg, #f7f5f2 0%, #ffffff 58%, #f7f5f2 100%);
    }

    .shell {
      width: min(calc(100% - 2rem), var(--max-width));
      margin: 0 auto;
      padding: 2.5rem 0 3rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .brand img {
      height: 2.5rem;
      width: auto;
    }

    h1, p { margin-top: 0; }

    h1 {
      font-size: clamp(2rem, 5vw, 2.9rem);
      line-height: 1.06;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .muted { color: var(--muted); }

    .cta {
      margin-top: 1rem;
      display: inline-flex;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.7rem 1rem;
      background: linear-gradient(135deg, #d63278, #e06b0a);
      color: #111;
      font-weight: 700;
      text-decoration: none;
    }

    .nav {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .nav a {
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      padding: 0.35rem 0.7rem;
      text-decoration: none;
      font-weight: 600;
    }

    .nav a:hover,
    .nav a:focus-visible {
      border-color: rgba(214, 50, 120, 0.5);
      outline: none;
    }
  </style>
</head>
<body>
  <main class="shell">
    <article class="panel">
      <div class="brand">
        <img src="./ratio-logo.svg" alt="Axniks Ratio logo">
        <p class="muted" style="margin:0;">Axniks Ltd</p>
      </div>
      <h1>Employment issue now? Start with Ratio on WhatsApp.</h1>
      <p class="muted">
        Ratio gives UK small business owners immediate employment risk triage. Share what happened, get clear next steps, and escalate when needed.
      </p>
      <a class="cta" href="https://api.whatsapp.com/send?text=Hi%20Ratio%2C%20I%20need%20help%20with%20an%20employment%20issue." target="_blank" rel="noopener">Open WhatsApp</a>

      <nav class="nav" aria-label="Navigation">
        <a href="./solicitor-partner.html">I am a solicitor</a>
        <a href="./service-partner.html">I want to be a partner</a>
        <a href="./investors.html">Investors</a>
      </nav>
    </article>
  </main>
</body>
</html>
